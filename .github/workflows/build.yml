name: Build & Integration Test

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew :uhabits-android:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk
          retention-days: 7

  supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Test Supabase write (habits)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/habits" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"id":9999,"uuid":"ci-test-'$GITHUB_RUN_ID'","device_id":"ci-runner","name":"CI Test Habit","freq_num":1,"freq_den":1}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE"
          echo "$BODY"
          if [ "$HTTP_CODE" != "201" ]; then echo "FAIL: expected 201"; exit 1; fi

      - name: Test Supabase write (entries)
        run: |
          TIMESTAMP=$(($(date +%s) * 1000))
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/entries" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"device_id":"ci-runner","habit_id":9999,"timestamp":'$TIMESTAMP',"value":2,"notes":"CI test"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then echo "FAIL: expected 201"; exit 1; fi

      - name: Test Supabase write (coaching)
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/coaching" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"device_id":"ci-runner","message":"CI pipeline working","type":"celebration"}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "201" ]; then echo "FAIL: expected 201"; exit 1; fi

      - name: Test Supabase read
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/habits?device_id=eq.ci-runner" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -1)
          echo "HTTP $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then echo "FAIL: expected 200"; exit 1; fi
          if ! echo "$BODY" | grep -q "CI Test Habit"; then echo "FAIL: habit not found"; exit 1; fi
          echo "SUCCESS: habit found in Supabase"

      - name: Test RLS isolation (anon key should not see ci-runner data)
        run: |
          RESPONSE=$(curl -s \
            "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/habits?device_id=eq.ci-runner" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-device-id: wrong-device")
          if [ "$RESPONSE" != "[]" ]; then echo "FAIL: RLS not isolating"; exit 1; fi
          echo "SUCCESS: RLS isolation confirmed"

      - name: Cleanup test data
        if: always()
        run: |
          curl -s "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/habits?device_id=eq.ci-runner" \
            -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          curl -s "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/entries?device_id=eq.ci-runner" \
            -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          curl -s "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/coaching?device_id=eq.ci-runner" \
            -X DELETE \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          echo "Cleanup done"
