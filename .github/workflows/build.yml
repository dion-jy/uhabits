name: Build Debug APK

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build core
        run: ./gradlew :uhabits-core:build --stacktrace --quiet

      - name: Build debug APK
        run: ./gradlew :uhabits-android:assembleDebug --stacktrace --quiet

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk
          retention-days: 7
