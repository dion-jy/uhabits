name: Build & Test

on:
  push:
    paths-ignore: ['**.md']
  pull_request:
    paths-ignore: ['**.md']

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Debug signing report
        run: ./gradlew :uhabits-android:signingReport --quiet 2>&1 | grep -A 1 "SHA1"

      - name: Build debug APK
        run: ./gradlew :uhabits-android:assembleDebug --stacktrace -PGOOGLE_WEB_CLIENT_ID="${{ secrets.GOOGLE_WEB_CLIENT_ID }}"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk
          retention-days: 7

      - name: Supabase E2E - write habits
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/habits" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=representation" \
            -d '{"id":9999,"uuid":"ci-test-'$GITHUB_RUN_ID'","device_id":"ci-runner","name":"CI Test Habit","freq_num":1,"freq_den":1}')
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          if [ "$HTTP_CODE" != "201" ]; then echo "FAIL: expected 201, got $HTTP_CODE"; exit 1; fi

      - name: Supabase E2E - write entries
        run: |
          TIMESTAMP=$(($(date +%s) * 1000))
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/entries" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"device_id":"ci-runner","habit_id":9999,"timestamp":'$TIMESTAMP',"value":2}')
          if [ "$HTTP_CODE" != "201" ]; then echo "FAIL: expected 201"; exit 1; fi

      - name: Supabase E2E - read + RLS
        run: |
          BODY=$(curl -s "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/habits?device_id=eq.ci-runner" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}")
          echo "$BODY" | grep -q "CI Test Habit" || { echo "FAIL: habit not found"; exit 1; }
          RLS=$(curl -s "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/habits?device_id=eq.ci-runner" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "x-device-id: wrong-device")
          [ "$RLS" = "[]" ] || { echo "FAIL: RLS not isolating"; exit 1; }

      - name: Supabase E2E - cleanup
        if: always()
        run: |
          for table in habits entries coaching; do
            curl -s "https://vzhkkxqwqtqajnutpjmt.supabase.co/rest/v1/$table?device_id=eq.ci-runner" \
              -X DELETE \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"
          done

