name: Smoke Test (Launch App)

on:
  push:
    branches: [feature/agent-substrate]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        run: ./gradlew :uhabits-android:assembleDebug --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch app and capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            adb install uhabits-android/build/outputs/apk/debug/uhabits-android-debug.apk
            adb logcat -c
            adb shell am start -n org.isoron.uhabits.loop/org.isoron.uhabits.MainActivity
            sleep 20
            echo "=== PROCESS CHECK ==="
            adb shell pidof org.isoron.uhabits.loop && echo "APP RUNNING OK" || echo "APP NOT RUNNING"
            echo "=== LOGCAT DUMP ==="
            adb logcat -d > /tmp/logcat.txt 2>&1
            cat /tmp/logcat.txt | grep -i "uhabits\|FATAL\|AndroidRuntime" | tail -100

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: /tmp/logcat.txt
          retention-days: 3
