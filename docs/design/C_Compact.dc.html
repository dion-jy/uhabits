<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@300;400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; font-family: 'IBM Plex Sans KR', 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #8DA2FF; } a:hover { color: #AFBEFF; }
    .num { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #0D0F11; color: #E7EAEC; overflow: hidden; display: flex; flex-direction: column;">

  <!-- top -->
  <div style="padding: 60px 20px 0 20px; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div class="num" style="font-size: 11px; font-weight: 500; letter-spacing: 0.08em; color: #79838A;">2026.09.10 목</div>
      <div style="display: flex; align-items: center; gap: 7px;">
        <div style="width: 5px; height: 5px; border-radius: 50%; background: #3FA98C;"></div>
        <div style="font-size: 10.5px; font-weight: 400; color: #5F686E;">동기화 2분 전</div>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 25px; font-weight: 600; letter-spacing: -0.015em;">오늘</div>
      <div class="num" style="font-size: 13px; font-weight: 500; color: #79838A;">3<span style="color:#3C444A;">/</span>6</div>
    </div>
  </div>

  <!-- coach -->
  <div style="margin: 18px 20px 0 20px; padding: 13px 14px; border: 1px solid #22272B; border-radius: 10px; background: #131719; display: flex; flex-direction: column; gap: 8px;">
    <div style="display: flex; align-items: center; gap: 7px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8DA2FF" stroke-width="1.7" stroke-linejoin="round"><path d="M12 3l2.1 5.4L19.5 10.5l-5.4 2.1L12 18l-2.1-5.4L4.5 10.5l5.4-2.1z"/></svg>
      <div style="font-size: 10px; font-weight: 600; letter-spacing: 0.11em; color: #8DA2FF;">코치</div>
    </div>
    <div style="font-size: 13px; font-weight: 400; line-height: 1.6; color: #B9C1C6; text-wrap: pretty;">명상은 이번 주 7일 모두 채웠어요. 일기 쓰기만 이틀 밀렸는데, 자기 전 5분으로 줄여서 오늘 다시 이어볼까요?</div>
  </div>

  <!-- list -->
  <div style="flex-grow: 1; padding: 0 20px; margin-top: 22px; display: flex; flex-direction: column;">

    <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; color: #4E565B; padding-bottom: 8px;">아침</div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="display: flex; align-items: center; gap: 12px; height: 48px;">
      <div style="width: 18px; height: 18px; border-radius: 5px; background: #8DA2FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0D0F11" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
      </div>
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 400; color: #6E777D;">아침 운동</div>
      <div style="display: flex; align-items: center; gap: 3px;">
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #22272B;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #8DA2FF;"></div>
      </div>
      <div class="num" style="font-size: 11px; color: #5F686E; width: 30px; text-align: right;">12일</div>
    </div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="display: flex; align-items: center; gap: 12px; height: 48px;">
      <div style="width: 18px; height: 18px; border-radius: 5px; background: #8DA2FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0D0F11" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
      </div>
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 400; color: #6E777D;">명상</div>
      <div style="display: flex; align-items: center; gap: 3px;">
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #3B4A7A;"></div>
        <div style="width: 5px; height: 5px; border-radius: 1.5px; background: #8DA2FF;"></div>
      </div>
      <div class="num" style="font-size: 11px; color: #5F686E; width: 30px; text-align: right;">31일</div>
    </div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; color: #4E565B; padding: 18px 0 8px 0;">낮</div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="display: flex; align-items: center; gap: 12px; height: 48px;">
      <div style="width: 18px; height: 18px; border-radius: 5px; border: 1.4px solid #333B41; box-sizing: border-box; position: relative; overflow: hidden; flex-shrink: 0;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70%; background: #46538A;"></div>
      </div>
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 400;">물 2L</div>
      <div class="num" style="font-size: 11.5px; color: #79838A;">1.4 / 2.0</div>
      <div style="width: 26px; height: 26px; border-radius: 7px; border: 1px solid #2A3035; display: flex; align-items: center; justify-content: center;">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8DA2FF" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="display: flex; align-items: center; gap: 12px; height: 48px;">
      <div style="width: 18px; height: 18px; border-radius: 5px; border: 1.4px solid #333B41; box-sizing: border-box; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 400;">영어 단어 30개</div>
      <div class="num" style="font-size: 11px; color: #5F686E;">3 / 5회</div>
    </div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; color: #4E565B; padding: 18px 0 8px 0;">저녁</div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="display: flex; align-items: center; gap: 12px; height: 48px;">
      <div style="width: 18px; height: 18px; border-radius: 5px; background: #8DA2FF; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#0D0F11" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
      </div>
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 400; color: #6E777D;">독서 30분</div>
      <div class="num" style="font-size: 11px; color: #5F686E; width: 30px; text-align: right;">8일</div>
    </div>
    <div style="height: 1px; background: #1C2124;"></div>

    <div style="display: flex; align-items: center; gap: 12px; height: 48px;">
      <div style="width: 18px; height: 18px; border-radius: 5px; border: 1.4px solid #333B41; box-sizing: border-box; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; font-size: 14.5px; font-weight: 400;">일기 쓰기</div>
      <div class="num" style="font-size: 11px; color: #7A6242;">2일 밀림</div>
    </div>
    <div style="height: 1px; background: #1C2124;"></div>

  </div>

  <!-- quick add -->
  <div style="padding: 12px 20px 30px 20px;">
    <div style="height: 46px; border: 1px solid #23282C; border-radius: 12px; background: #131719; display: flex; align-items: center; gap: 10px; padding: 0 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5F686E" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <div style="flex-grow: 1; font-size: 13.5px; color: #5F686E;">기록하거나 습관 추가…</div>
      <div class="num" style="font-size: 10px; color: #444C51; border: 1px solid #23282C; border-radius: 5px; padding: 3px 6px;">⌘K</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
