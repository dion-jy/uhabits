<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300..600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Newsreader', Georgia, serif; -webkit-font-smoothing: antialiased; }
    a { color: #2F4A38; } a:hover { color: #1D3223; }
    .ui { font-family: 'Instrument Sans', system-ui, sans-serif; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; background: #F5F2EA; color: #1F1C16; overflow: hidden; display: flex; flex-direction: column;">

  <div style="padding: 62px 26px 0 26px; display: flex; align-items: center; justify-content: space-between;">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8C8474" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    <div class="ui" style="font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #A9A192;">NEW HABIT</div>
    <div class="ui" style="font-size: 13px; font-weight: 600; color: #2F4A38;">Save</div>
  </div>

  <div style="padding: 34px 26px 0 26px; display: flex; flex-direction: column; gap: 26px;">

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div class="ui" style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; color: #A9A192;">NAME</div>
      <div style="font-size: 27px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.15;">Evening walk</div>
      <div style="height: 1px; background: #CFC7B4;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 9px;">
      <div class="ui" style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; color: #A9A192;">QUESTION</div>
      <div style="font-size: 17px; font-weight: 400; color: #6F675A;">Did you walk after dinner?</div>
      <div style="height: 1px; background: #E7E1D3;"></div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 12px;">
      <div class="ui" style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; color: #A9A192;">TYPE</div>
      <div style="display: flex; gap: 24px;">
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 17px; font-weight: 500;">Yes or no</div>
          <div style="height: 2px; background: #2F4A38;"></div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <div style="font-size: 17px; font-weight: 400; color: #A9A192;">Measurable</div>
          <div style="height: 2px; background: #F5F2EA;"></div>
        </div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 13px;">
      <div class="ui" style="font-size: 9.5px; font-weight: 700; letter-spacing: 0.2em; color: #A9A192;">COLOUR</div>
      <div style="display: flex; gap: 11px;">
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #D32F2F;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #F57C00;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #FF8F00;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #388E3C;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #2F4A38; box-shadow: 0 0 0 2px #F5F2EA, 0 0 0 3.5px #2F4A38;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #00897B;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #1976D2;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #303F9F;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #8E24AA;"></div>
        <div style="width: 21px; height: 21px; border-radius: 50%; background: #D81B60;"></div>
      </div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <div style="height: 1px; background: #DED7C7;"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 56px;">
        <div class="ui" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #8C8474;">FREQUENCY</div>
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="font-size: 17px; font-weight: 400;">Every day</div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4AC9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <div style="height: 1px; background: #E7E1D3;"></div>
      <div style="display: flex; align-items: center; justify-content: space-between; height: 56px;">
        <div class="ui" style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #8C8474;">REMINDER</div>
        <div style="display: flex; align-items: center; gap: 9px;">
          <div style="font-size: 17px; font-weight: 400;">8:30 PM</div>
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B4AC9A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </div>
      </div>
      <div style="height: 1px; background: #DED7C7;"></div>
    </div>

    <div style="display: flex; align-items: center; gap: 12px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4AC9A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.4L16.2 4.4a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.4 19z"/></svg>
      <div style="font-size: 15px; font-weight: 300; font-style: italic; color: #B4AC9A;">Add a note</div>
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
