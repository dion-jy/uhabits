<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@300;400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: 'Gothic A1', 'Apple SD Gothic Neo', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #A2542B; } a:hover { color: #7E4019; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #FBFAF7; color: #1B1917; position: relative; overflow: hidden; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="padding: 62px 24px 0 24px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.09em; color: #A8A29A;">9월 10일 목요일</div>
      <div style="display: flex; align-items: center; gap: 18px;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#57534E" stroke-width="1.7" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: baseline; justify-content: space-between;">
      <div style="font-size: 33px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1;">오늘</div>
      <div style="font-size: 13.5px; font-weight: 500; color: #57534E;">3 / 6 완료</div>
    </div>

    <div style="height: 3px; background: #EDE8E0; border-radius: 2px; overflow: hidden;">
      <div style="width: 50%; height: 100%; background: #A2542B; border-radius: 2px;"></div>
    </div>
  </div>

  <!-- list -->
  <div style="flex-grow: 1; overflow: hidden; padding: 0 24px;">

    <div style="margin-top: 30px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; color: #A8A29A;">아침</div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 15px; height: 60px;">
        <div style="width: 25px; height: 25px; border-radius: 50%; background: #A2542B; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
        </div>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 500; color: #A8A29A;">아침 운동</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #C4BEB4;">12일</div>
      </div>
      <div style="height: 1px; background: #EDE8E0; margin-left: 40px;"></div>
      <div style="display: flex; align-items: center; gap: 15px; height: 60px;">
        <div style="width: 25px; height: 25px; border-radius: 50%; background: #A2542B; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
        </div>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 500; color: #A8A29A;">명상</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #C4BEB4;">31일</div>
      </div>
    </div>

    <div style="margin-top: 26px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; color: #A8A29A;">낮</div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 15px; height: 62px;">
        <div style="width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid #D8D2C8; background: #FBFAF7; position: relative; flex-shrink: 0; overflow: hidden;">
          <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70%; background: #E4CBB7;"></div>
        </div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 16px; font-weight: 500;">물 2L</div>
          <div style="font-size: 12px; font-weight: 500; color: #A8A29A;">1.4 / 2.0 L</div>
        </div>
        <div style="width: 34px; height: 34px; border-radius: 10px; border: 1px solid #E4DED4; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A2542B" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </div>
      </div>
      <div style="height: 1px; background: #EDE8E0; margin-left: 40px;"></div>
      <div style="display: flex; align-items: center; gap: 15px; height: 62px;">
        <div style="width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid #D8D2C8; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 3px;">
          <div style="font-size: 16px; font-weight: 500;">영어 단어 30개</div>
          <div style="font-size: 12px; font-weight: 500; color: #A8A29A;">주 5회 · 이번 주 3회</div>
        </div>
      </div>
    </div>

    <div style="margin-top: 26px; font-size: 11.5px; font-weight: 700; letter-spacing: 0.12em; color: #A8A29A;">저녁</div>

    <div style="display: flex; flex-direction: column;">
      <div style="display: flex; align-items: center; gap: 15px; height: 60px;">
        <div style="width: 25px; height: 25px; border-radius: 50%; background: #A2542B; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
        </div>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 500; color: #A8A29A;">독서 30분</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #C4BEB4;">8일</div>
      </div>
      <div style="height: 1px; background: #EDE8E0; margin-left: 40px;"></div>
      <div style="display: flex; align-items: center; gap: 15px; height: 60px;">
        <div style="width: 25px; height: 25px; border-radius: 50%; border: 1.5px solid #D8D2C8; flex-shrink: 0;"></div>
        <div style="flex-grow: 1; font-size: 16px; font-weight: 500;">일기 쓰기</div>
        <div style="font-size: 12.5px; font-weight: 500; color: #C4BEB4;">5일</div>
      </div>
    </div>

  </div>

  <!-- bottom nav -->
  <div style="border-top: 1px solid #EDE8E0; background: #FBFAF7; padding: 11px 40px 26px 40px; display: flex; justify-content: space-between;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A2542B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5h16M4 12h16M4 17.5h10"/></svg>
      <div style="font-size: 10.5px; font-weight: 700; color: #A2542B;">오늘</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A8A29A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/></svg>
      <div style="font-size: 10.5px; font-weight: 500; color: #A8A29A;">기록</div>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px; width: 64px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#A8A29A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V9M10 19V5M16 19v-6M22 19H2"/></svg>
      <div style="font-size: 10.5px; font-weight: 500; color: #A8A29A;">통계</div>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
