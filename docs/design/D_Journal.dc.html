<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@300;400;500;600&family=Gothic+A1:wght@400;500;600;700&display=swap">
  <style>
    body { margin: 0; font-family: 'Hahmlet', 'Apple SD Gothic Neo', Georgia, serif; -webkit-font-smoothing: antialiased; }
    a { color: #2F4A38; } a:hover { color: #1D3223; }
    .ui { font-family: 'Gothic A1', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; background: #F5F2EA; color: #1F1C16; overflow: hidden; display: flex; flex-direction: column;">

  <!-- header -->
  <div style="padding: 62px 26px 0 26px; display: flex; flex-direction: column; gap: 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div class="ui" style="font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #A9A192;">습관 일지</div>
      <div style="display: flex; align-items: center; gap: 16px;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C8474" stroke-width="1.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8C8474" stroke-width="1.6" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </div>
    </div>

    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 37px; font-weight: 500; letter-spacing: -0.025em; line-height: 1;">9월 10일</div>
        <div class="ui" style="font-size: 12px; font-weight: 500; color: #8C8474; letter-spacing: 0.04em;">목요일 · 올해 253번째 날</div>
      </div>
      <div class="ui" style="font-size: 12px; font-weight: 600; color: #8C8474; padding-bottom: 3px;">3/6</div>
    </div>
  </div>

  <div style="height: 1px; background: #DED7C7; margin: 22px 26px 0 26px;"></div>

  <!-- list -->
  <div style="flex-grow: 1; padding: 0 26px; display: flex; flex-direction: column;">

    <div style="display: flex; align-items: center; gap: 16px; height: 58px;">
      <div style="width: 19px; height: 19px; border-radius: 3px; background: #2F4A38; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F5F2EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
      </div>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 400; color: #A9A192;">아침 운동</div>
      <div class="ui" style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #BEB6A5;">12일</div>
    </div>
    <div style="height: 1px; background: #E7E1D3;"></div>

    <div style="display: flex; align-items: center; gap: 16px; height: 58px;">
      <div style="width: 19px; height: 19px; border-radius: 3px; background: #2F4A38; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F5F2EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
      </div>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 400; color: #A9A192;">명상</div>
      <div class="ui" style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #BEB6A5;">31일</div>
    </div>
    <div style="height: 1px; background: #E7E1D3;"></div>

    <div style="display: flex; align-items: center; gap: 16px; height: 58px;">
      <div style="width: 19px; height: 19px; border-radius: 3px; border: 1.2px solid #CFC7B4; box-sizing: border-box; position: relative; overflow: hidden; flex-shrink: 0;">
        <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 70%; background: #B9C6BB;"></div>
      </div>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 400;">물 2L</div>
      <div class="ui" style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #8C8474;">1.4 / 2.0 L</div>
    </div>
    <div style="height: 1px; background: #E7E1D3;"></div>

    <div style="display: flex; align-items: center; gap: 16px; height: 58px;">
      <div style="width: 19px; height: 19px; border-radius: 3px; border: 1.2px solid #CFC7B4; box-sizing: border-box; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 400;">영어 단어 30개</div>
      <div class="ui" style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #BEB6A5;">주 3/5</div>
    </div>
    <div style="height: 1px; background: #E7E1D3;"></div>

    <div style="display: flex; align-items: center; gap: 16px; height: 58px;">
      <div style="width: 19px; height: 19px; border-radius: 3px; background: #2F4A38; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#F5F2EA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.8 4.8L19 7.4"/></svg>
      </div>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 400; color: #A9A192;">독서 30분</div>
      <div class="ui" style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #BEB6A5;">8일</div>
    </div>
    <div style="height: 1px; background: #E7E1D3;"></div>

    <div style="display: flex; align-items: center; gap: 16px; height: 58px;">
      <div style="width: 19px; height: 19px; border-radius: 3px; border: 1.2px solid #CFC7B4; box-sizing: border-box; flex-shrink: 0;"></div>
      <div style="flex-grow: 1; font-size: 17px; font-weight: 400;">일기 쓰기</div>
      <div class="ui" style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; color: #BEB6A5;">5일</div>
    </div>
    <div style="height: 1px; background: #DED7C7;"></div>

    <!-- month rhythm -->
    <div style="padding-top: 26px; display: flex; flex-direction: column; gap: 12px;">
      <div class="ui" style="font-size: 10px; font-weight: 700; letter-spacing: 0.2em; color: #A9A192;">9월</div>
      <div style="display: flex; gap: 4px; align-items: flex-end; height: 34px;">
        <div style="flex-grow: 1; height: 100%; background: #C6CFC4; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 60%; background: #DDD8C9; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 100%; background: #C6CFC4; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 80%; background: #C6CFC4; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 40%; background: #DDD8C9; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 100%; background: #C6CFC4; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 100%; background: #C6CFC4; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 80%; background: #C6CFC4; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 100%; background: #C6CFC4; border-radius: 1px;"></div>
        <div style="flex-grow: 1; height: 50%; background: #2F4A38; border-radius: 1px;"></div>
      </div>
      <div class="ui" style="font-size: 11.5px; font-weight: 500; color: #8C8474;">이번 달 82% · 최고 연속 31일</div>
    </div>

  </div>

  <!-- one line note -->
  <div style="margin: 0 26px 30px 26px; padding-top: 18px; border-top: 1px solid #DED7C7; display: flex; align-items: center; gap: 12px;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#B4AC9A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4.4L16.2 4.4a2 2 0 012.8 0l.6.6a2 2 0 010 2.8L8.4 19z"/></svg>
    <div style="font-size: 15px; font-weight: 300; font-style: italic; color: #B4AC9A;">오늘 한 줄 남기기</div>
  </div>

</div>
</x-dc>
</body>
</html>
